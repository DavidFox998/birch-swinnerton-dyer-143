name: Count Files — BSD 143 DOI Audit

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Count all files
        run: |
          echo "## File Counts — birch-swinnerton-dyer-143" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          TOTAL=$(find . -type f | grep -v ".git" | wc -l)
          echo "**Total files:** $TOTAL" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Folder | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          for dir in BSD docs hasseprimset lean .github/workflows; do
            if [ -d "$dir" ]; then
              C=$(find $dir -type f | wc -l)
              echo "| $dir | $C |" >> $GITHUB_STEP_SUMMARY
            fi
          done
          echo "| root *.lean | $(ls -1 *.lean 2>/dev/null | wc -l) |" >> $GITHUB_STEP_SUMMARY
          echo "| root *.py | $(ls -1 *.py 2>/dev/null | wc -l) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Lean files only" >> $GITHUB_STEP_SUMMARY
          find . -name "*.lean" | wc -l | xargs echo "Total .lean:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          find . -name "BSD_Genesis*.lean" | wc -l | xargs echo "Genesis 763..889:" >> $GITHUB_STEP_SUMMARY

      - name: List all lean files
        run: |
          echo "=== ALL FILES ==="
          find . -type f | grep -v ".git" | sort
          echo ""
          echo "=== BSD_Genesis ==="
          ls -1 BSD/BSD_Genesis* 2>/dev/null | wc -l
          echo "files"
          echo ""
          echo "=== hasseprimset not in this parent, BSD/ contains genesis ==="
          ls BSD/ | head -20
